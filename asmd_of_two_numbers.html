<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arithmetic operations</title>
</head>
<body>
    <script>
        function add(a,b){
            return a+b;
        }
        function subtract(a,b){
            return a-b;
        }
        function multiply(a,b){
            return a*b;
        }
        function divide(a,b){
            return a/b;
        }
        function modulus(a,b){
            return a%b;
        }
        let a = 60;
        let b = 20;
        console.log("Addition of two numbers is: "+add(a,b));
        console.log("Subtraction of two numbers is: "+subtract(a,b));
        console.log("Multiplication of two numbers is: "+multiply(a,b));
        console.log("Division of two numbers is: "+divide(a,b));
        console.log("Modulus of two numbers is: "+modulus(a,b));
    </script>
</body>
</html>
