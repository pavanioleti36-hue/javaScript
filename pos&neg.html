<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positive & negative</title>
</head>
<body>
    <script>
        let num = 0;
        if(num>0){
            console.log("the number is positive");
        }
        else if(num<0){
          console.log("the number is negative");
        }
        else{
            console.log("the number is zero");
        }
    </script>
</body>
</html>
